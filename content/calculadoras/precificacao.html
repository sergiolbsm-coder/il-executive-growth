<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora de Precificação — Instituto da Liderança</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Cormorant+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --idl-magenta:#FF0060;--idl-purple:#391694;--idl-purple-dark:#261062;--idl-violet:#4D1DBF;--idl-turquoise:#00D0C9;
  --idl-text:#24153E;--idl-text-muted:#6F667E;--idl-background:#FBF9FF;--idl-background-soft:#F4F0FB;--idl-white:#FFFFFF;
  --idl-border:rgba(57,22,148,.13);
  --idl-gradient:linear-gradient(145deg,#261062,#391694 70%,#4D1DBF);
  --idl-gradient-light:radial-gradient(ellipse 60% 40% at 15% 20%,rgba(255,0,96,.06) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 85% 75%,rgba(77,29,191,.04) 0%,transparent 55%),#FBF9FF;
  --ink:#FBF9FF;--parch:#24153E;--gold:#FF0060;--gold-lt:#00D0C9;--gold-dk:#261062;--mid:#6F667E;--border:rgba(57,22,148,.13);
  --r:12px;--r-sm:8px;--ok:#168D53;--warn:#B45309;--err:#C0152F;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#FBF9FF;color:#24153E;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;background:var(--idl-gradient-light)}
.sidebar{width:220px;height:100vh;background:linear-gradient(180deg,#261062 0%,#391694 100%);display:flex;flex-direction:column;padding:24px 0;position:fixed;left:0;top:0;z-index:5;overflow-y:auto}
.sidebar-logo{padding:0 20px 20px}
.sidebar-logo img{height:120px;width:auto;display:block;margin:0 auto;background:#fff;border-radius:12px;padding:6px}
.sidebar-logo-sub{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.5);text-transform:uppercase;text-align:center;margin-top:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:13px;font-weight:500;color:rgba(255,255,255,.65);cursor:pointer;transition:all .2s;border-left:2px solid transparent;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left;font-family:inherit;width:100%}
.nav-item .num{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.7}
.nav-item:hover,.nav-item.active{color:#FBF9FF;border-left-color:#FF0060;background:rgba(255,0,96,.08)}
.side-tools{margin-top:auto;padding:16px 20px 0;display:flex;flex-direction:column;gap:6px}
.side-tools button{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px;font:500 12px 'DM Sans';cursor:pointer}
.side-tools button:hover{background:rgba(255,255,255,.16)}
main{position:relative;z-index:1;margin-left:220px;padding:28px 36px 60px;max-width:1080px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#FF0060;background:rgba(255,0,96,.07);border:1px solid var(--border)}
h1{font-family:'Cormorant Garamond',serif;font-size:36px;color:#261062;margin:10px 0 4px;line-height:1.1}
.sub{color:var(--mid);font-size:14.5px;max-width:720px;line-height:1.55;margin-bottom:18px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 14px}
.kpi span{display:block;font-size:10.5px;color:var(--mid);text-transform:uppercase;letter-spacing:.07em}
.kpi b{font-size:20px;color:#261062;font-variant-numeric:tabular-nums}
.kpi.hl{background:#261062}.kpi.hl span{color:rgba(255,255,255,.7)}.kpi.hl b{color:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:16px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--idl-purple);margin:0 0 10px;font-weight:700}
.card h3.mt{margin-top:20px}
label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 4px}
label small{font-weight:400;color:var(--mid)}
input,select{width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:#24153E;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .25s}
input:focus,select:focus{border-color:#FF0060}
input[type=range]{padding:0;accent-color:#FF0060}
input[type=checkbox]{width:auto;accent-color:#FF0060}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.hint{font-size:12.5px;color:var(--mid);line-height:1.5;margin-top:6px}
.btn-primary{background:linear-gradient(135deg,#261062,#FF0060);color:#FBF9FF;border:none;border-radius:8px;padding:12px 26px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:all .3s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,0,96,.35)}
.btn-secondary{background:transparent;color:#6F667E;border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .25s}
.btn-secondary:hover{border-color:rgba(255,0,96,.4);color:#24153E}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-x{background:none;border:0;color:var(--mid);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:6px}
.btn-x:hover{color:var(--err);background:#FEF2F2}
.nav-btns{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.alert{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:10px;border-left:4px solid;line-height:1.5}
.alert.w{background:#FFF7ED;border-color:var(--warn);color:#7C2D12}
.alert.e{background:#FEF2F2;border-color:var(--err);color:#7F1D1D}
.alert.i{background:#F0FDFA;border-color:var(--idl-turquoise);color:#134E4A}
.alert.ok{background:#F0FDF4;border-color:var(--ok);color:#14532D}
.alert button{margin-left:8px}
.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.seg{border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;background:#fff;text-align:left;font-family:inherit;transition:all .2s}
.seg:hover{border-color:rgba(255,0,96,.4)}
.seg.on{border-color:#FF0060;background:rgba(255,0,96,.05)}
.seg b{display:block;font-size:14px;color:#261062}.seg small{color:var(--mid);font-size:12px;line-height:1.4;display:block;margin-top:2px}
.frow{display:grid;grid-template-columns:1fr 130px 34px;gap:8px;margin-bottom:6px;align-items:center}
.frow.d{grid-template-columns:1fr 120px 80px 34px}
.frow.c{grid-template-columns:1fr 120px 70px 34px}
.frow.ins{grid-template-columns:1fr 100px 100px 100px 34px}
.frow.cv{grid-template-columns:1fr 130px 34px}
.frow.ev{grid-template-columns:1fr 100px 130px 170px 34px}
.cathead{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--idl-purple);margin:12px 0 6px}
.frow .chk{font-size:11px;color:var(--mid);display:flex;align-items:center;gap:4px;white-space:nowrap}
.cols{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.icard{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.icard.on{border-color:#FF0060;background:rgba(255,0,96,.05)}
.icard b{font-size:13.5px;display:block}.icard small{font-size:11.5px;color:var(--mid)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mid);padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid var(--idl-background-soft)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--idl-background-soft)}tr.pick.on td{background:rgba(255,0,96,.06)}
.pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:100px;background:var(--idl-background-soft);color:var(--idl-purple)}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:8px 0 6px}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;min-width:0;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mid)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.tier{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#fff}
.tier span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.tier b{display:block;font-size:22px;color:#261062;font-variant-numeric:tabular-nums}
.tier small{color:var(--mid);font-size:12px}
.tier.alvo{border:2px solid #FF0060;background:rgba(255,0,96,.04)}
.print-only{display:none}
.toast{position:fixed;bottom:24px;right:24px;background:#391694;color:#FBF9FF;border-radius:10px;padding:14px 20px;font-size:14px;font-weight:500;box-shadow:0 8px 32px rgba(57,22,148,.35);z-index:9999;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:860px){
  .sidebar{position:sticky;width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:6px 0;align-items:center}
  .sidebar-logo{padding:0 12px}.sidebar-logo img{height:44px}.sidebar-logo-sub,.side-tools{display:none}
  .nav-item{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:12px 12px;width:auto}
  .nav-item:hover,.nav-item.active{border-bottom-color:#FF0060}
  main{margin-left:0;padding:18px 16px 60px}
  .g2,.g3,.g4,.cols,.tiers{grid-template-columns:1fr}
  .frow,.frow.d,.frow.c,.frow.ins{grid-template-columns:1fr 1fr 34px}
  .frow.ev{grid-template-columns:1fr 1fr}
  h1{font-size:30px}
}
@media print{
  .sidebar,.nav-btns,.noprint,.bg,.toast,.btn-x{display:none!important}
  main{margin:0;padding:0;max-width:none}body{background:#fff}
  .print-only{display:block}.card{break-inside:avoid;border-color:#ccc}
}
</style>

/* ============ cálculo ============ */
function fixoParts(){
  let base=0,enc=0,dep=0,prov=0;
  S.fixos.forEach(f=>{const v=N(f.v);if(f.k==='d'){dep+=N(f.vida)>0?v/N(f.vida):0}else{base+=v;if(f.enc)enc+=v}});
  prov=enc*N(S.encPct)/100;
  return {base,dep,prov,total:base+dep+prov};
}
function ctx(){
  const c=S.cap,f=fixoParts();
  const bruto=N(c.pessoas)*N(c.horasDia)*N(c.dias);
  const hv=bruto*(1-N(c.naoFat)/100)*(N(c.ocup)/100);
  return {f,bruto,hv,fixo:f.total,gfun:hv>0?f.total/hv:0};
}
const pctVar=()=>(N(S.taxas.imp)+N(S.taxas.com)+N(S.taxas.canal)+N(S.taxas.outros))/100;
const priceFor=(custo,l)=>{const d=1-pctVar()-l;return d>0.0001?custo/d:null};
const markup=l=>{const d=1-pctVar()-l;return d>0.0001?1/d:null};
function calc(it,g,hvOverride){
  const C=ctx();if(g==null)g=C.gfun;
  let cv=0,hrs=0,unit='unidade',cf=0,risco=0,capUn=0,rateio=false,div=1,ul='',desc=0;
  if(it.tipo==='hora'){cv=N(it.hora.cv);hrs=1;unit='hora';cf=g*hrs;capUn=C.hv}
  else if(it.tipo==='projeto'){const p=it.projeto;cv=p.custos.reduce((s,c)=>s+N(c.v),0);hrs=N(p.horas);unit='projeto';cf=g*hrs;capUn=hrs>0?C.hv/hrs:0;risco=(cv+cf)*N(p.risco)/100}
  else if(it.tipo==='evento'){const p=it.evento,n=N(p.pax),cort=Math.min(N(p.cort),95)/100,ing=p.modo==='ingresso';cv=p.custos.reduce((a,c)=>a+(c.m==='pp'?N(c.v)*n:N(c.v)),0);hrs=N(p.horas);unit='evento';cf=g*hrs;capUn=hrs>0?C.hv/hrs:0;risco=(cv+cf)*N(p.risco)/100;desc=ing?N(p.patroc):0;div=ing?Math.max(n*(1-cort),1):(n>0?n:1);ul=ing?'ingresso':'participante'}
  else if(it.tipo==='assessment'){const p=it.assessment,n=N(p.pessoas);cv=N(p.cvFixo)+N(p.cvPP)*n;hrs=N(p.horasSetup)+N(p.horasPP)*n;unit='assessment';cf=g*hrs;capUn=hrs>0?C.hv/hrs:0;risco=(cv+cf)*N(p.risco)/100;div=n>0?n:1;ul='pessoa'}
  else if(it.tipo==='licenca'){
    const p=it.licenca;
    if(p.modelo==='pacote'){const n=N(p.qtd);cv=N(p.cvLic)*n;hrs=N(p.horasSetup)+N(p.horasLic)*n;unit='lote';cf=g*hrs+(N(p.volMes)>0?C.fixo*N(p.part)/100/N(p.volMes)*n:0);div=n>0?n:1;ul='licença'}
    else{cv=N(p.cvLic);hrs=N(p.horasSup);unit='licença/mês';cf=(N(p.lics)>0?C.fixo*N(p.part)/100/N(p.lics):0)+g*hrs;capUn=N(p.lics)}
  }
  else{
    const p=it.produto;
    if(p.sub==='ficha'){
      const lote=p.insumos.reduce((s,i)=>s+(N(i.qp)>0?N(i.pp)/N(i.qp)*N(i.qu):0),0);
      cv=lote/(1-Math.min(N(p.perda),95)/100)/(N(p.rend)||1)+N(p.outrosUn);
      hrs=N(p.horasLote)/(N(p.rend)||1);
    }else{cv=N(p.compra)+N(p.frete)+N(p.outrosUn);hrs=N(p.min)/60}
    if(p.modo==='rateio'){rateio=true;cf=N(p.vol)>0?C.fixo*N(p.part)/100/N(p.vol):0;capUn=N(p.vol)}
    else{cf=g*hrs;capUn=hrs>0?C.hv/hrs:0}
  }
  return {cv,cf,risco,custo:cv+cf+risco-desc,desc,hrs,unit,capUn,rateio,div,ul};
}
const unitLabel=it=>it.tipo==='licenca'?(it.licenca.modelo==='pacote'?'lote':'licença/mês'):({hora:'hora',projeto:'projeto',evento:'evento',assessment:'assessment'}[it.tipo]||'unidade');
const ulbl=it=>it.tipo==='evento'?(it.evento.modo==='ingresso'?'ingresso':'participante'):it.tipo==='assessment'?'pessoa':it.tipo==='licenca'&&it.licenca.modelo==='pacote'?'licença':unitLabel(it);

function addCv(){S.itens[sel].projeto.custos.push({n:'',v:0});save();render()}

function tiers(c){return [0,N(S.taxas.lucro)/100,N(S.taxas.prem)/100].map(l=>priceFor(c.custo,l))}
function volRows(it,L){
  const key=it.tipo==='evento'?'evento':it.tipo==='assessment'?'assessment':'licenca',f={evento:'pax',assessment:'pessoas',licenca:'qtd'}[key];
  const cur=N(it[key][f])||1;
  const list=it.tipo==='evento'?[.5,.75,1,1.5,2].map(x=>Math.max(1,Math.round(cur*x))):it.tipo==='licenca'?[10,25,50,100,250,500]:[5,10,20,50,100];
  return [...new Set([...list,cur])].sort((a,b)=>a-b).map(n=>{const cl=JSON.parse(JSON.stringify(it));cl[key][f]=n;const cc=calc(cl);return {n,cc,pp:priceFor(cc.custo,L),cur:n===cur}});
}

    o+=`<div class="bar">${seg.map(s=>`<div style="width:${s[1]/tot*100}%;background:${s[2]}" title="${s[0]}">${s[1]/tot>.08?Math.round(s[1]/tot*100)+'%':''}</div>`).join('')}</div>

    if(it.tipo==='evento'){

      if(ing){
        const cort=Math.min(N(ev.cort),95)/100,t=N(it.mercado)>0?N(it.mercado):pAlvo/k;
        const fixoEv=ev.custos.reduce((a,x)=>a+(x.m==='pp'?0:N(x.v)),0)+c.cf-c.desc,ppEv=ev.custos.reduce((a,x)=>a+(x.m==='pp'?N(x.v):0),0);
        const contrib=t*(1-pv)-ppEv/(1-cort),be=contrib>0?fixoEv/contrib:null;
        o+=`<div class="card"><h3>Ponto de equilíbrio do evento com ingresso</h3>${be!=null?`<p>Com ingresso a <b>${brl(t)}</b>${N(it.mercado)>0?' (preço de mercado informado)':' (seu preço-alvo)'}, o evento se paga com <b>${num(Math.ceil(be),0)} ingressos pagos</b>${n>0?`, ${pc(Math.ceil(be)/Math.max(n*(1-cort),1)*100,0)} da lotação esperada (${num(n*(1-cort),0)} pagantes)`:''}. Depois disso, cada ingresso adicional deixa ${brl(contrib)} de contribuição.</p><p class="hint">Considera o custo fixo do evento, a sua equipe e o patrocínio; não inclui a margem de risco.</p>`:`<p style="color:var(--err)">A este preço de ingresso cada venda não cobre os custos por participante e os impostos.</p>`}</div>`;
      }
    }
    if(N(it.mercado)>0){
      const m=N(it.mercado),lucroReal=m*(1-pv)-c.custo/k,mg=lucroReal/m*100,mi=pMin/k,al=pAlvo/k;
      let cls,msg;
      if(m<mi)(cls='e',msg=`O preço do mercado (${brl(m)}) está <b>abaixo do seu mínimo</b> (${brl(mi)} por ${ul}). Vendendo nesse valor você perde ${brl(-lucroReal)} por ${ul}. Opções: reduzir custo/tempo, mudar o escopo, ou não competir por preço.`);
      else if(m<al)(cls='w',msg=`O mercado paga ${brl(m)}, abaixo do seu alvo (${brl(al)} por ${ul}). Margem real: <b>${pc(mg)}</b> (${brl(lucroReal)} por ${ul}) em vez de ${pc(L*100)}. Cobre os custos, mas rende menos que o planejado.`);
      else (cls='ok',msg=`O mercado aceita ${brl(m)}, acima do seu alvo. Margem real: <b>${pc(mg)}</b> (${brl(lucroReal)} por ${ul}). Há espaço para posicionar mais perto do premium.`);
      o+=`<div class="alert ${cls}"><b>Checagem de mercado.</b> ${msg}</div>`;
    }
    if(N(it.valor)>0){
      const r=pAlvo/k/N(it.valor)*100;
      o+=`<div class="alert i"><b>Preço × valor.</b> Seu preço-alvo equivale a ${pc(r)} do valor que o cliente obtém. ${r<5?'É muito pouco: há espaço para subir sem risco de parecer caro.':r<=25?'Faixa em geral confortável para o cliente (referência aproximada, varia por setor).':'É alto em relação ao retorno: você precisará demonstrar o resultado com clareza.'}</div>`;
    }
    const lic=it.tipo==='licenca'&&it.licenca.modelo!=='pacote'?it.licenca:null;
    const cvEff=lic?c.cv+g*N(lic.horasSup):c.cv;
    const fixoBE=lic?C.fixo*N(lic.part)/100:C.fixo;
    const base=N(it.mercado)>0?N(it.mercado)*k:pAlvo,mc=base*(1-pv)-cvEff,mc2=base*(1-disc/100)*(1-pv)-cvEff;
    const U=lic?'licença':unitLabel(it);
    o+=`<div class="card"><h3>Ponto de equilíbrio e descontos</h3><div class="g2"><div>`;
    if(mc>0){const be=fixoBE/mc;o+=`<p><b>Ponto de equilíbrio:</b> ${num(be,0)} ${U}${be>=2?'s':''} por mês para cobrir ${lic?'o custo fixo que o software carrega':'todo o custo fixo'} (${brl(fixoBE)}), se você vendesse só este item a ${brl(base)}.</p>${c.capUn>0?`<p class="hint">${lic?'Sua base esperada':'Sua capacidade para este item'} é de ~${num(c.capUn,0)}: o equilíbrio ${lic?'é':'usaria'} <b>${pc(be/c.capUn*100,0)}</b> ${lic?'dela':'dela'}.</p>`:''}`}
    else o+=`<p style="color:var(--err)"><b>Sem ponto de equilíbrio:</b> a este preço cada venda não cobre nem o custo variável e os impostos.</p>`;
    o+=`</div><div><p><b>Desconto de ${disc}% sobre ${brl(base)}:</b></p>`;
    if(disc===0)o+=`<p class="hint">Mova o controle para simular.</p>`;
    else if(mc2<=0)o+=`<p style="color:var(--err)">Com esse desconto, cada venda deixa de contribuir para o custo fixo. <b>Não vale a pena</b> por mais volume que traga.</p>`;
    else if(mc<=0)o+=`<p class="hint">Sem margem de contribuição no preço base.</p>`;
    else o+=`<p>A contribuição por venda cai de ${brl(mc)} para ${brl(mc2)}. Você precisaria vender <b>${pc((mc/mc2-1)*100,0)} a mais</b> só para ganhar o mesmo dinheiro.</p>`;
    o+=`</div></div></div>`;
    if(it.tipo==='evento'||it.tipo==='assessment'||(it.tipo==='licenca'&&!lic)){
      const noun=it.tipo==='evento'?(it.evento.modo==='ingresso'?'ingressos':'participantes'):it.tipo==='assessment'?'pessoas':'licenças';
      const rows=volRows(it,L).map(r=>`<tr ${r.cur?'style="font-weight:700;background:rgba(255,0,96,.05)"':''}><td>${r.n} ${noun}${r.cur?' (atual)':''}</td><td class="n">${brl(r.cc.custo)}</td><td class="n">${brl(r.pp)}</td><td class="n">${r.pp?brl(r.pp/r.n):'—'}</td><td class="n">${r.pp&&pAlvo?(r.pp/r.n/(pAlvo/k)-1>=0?'+':'')+pc((r.pp/r.n/(pAlvo/k)-1)*100,0):'—'}</td></tr>`).join('');
      o+=`<div class="card"><h3>Preço por volume</h3><table><tr><th>${it.tipo==='evento'?'Tamanho do evento':it.tipo==='assessment'?'Tamanho da turma':'Tamanho do lote'}</th><th class="n">Custo total</th><th class="n">Preço-alvo total</th><th class="n">Por ${ul}</th><th class="n">vs. atual</th></tr>${rows}</table><p class="hint">O trabalho e os custos fixos de preparação são diluídos entre mais ${noun}, então o preço por ${ul} cai com o volume. Use esta tabela para montar faixas de preço e descontos sem perder margem.</p></div>`;
    }
    if(lic){
      const ch=N(lic.churn)/100,mcu=pAlvo*(1-pv)-cvEff,ltv=ch>0&&mcu>0?mcu/ch:null,cac=N(lic.cac),pay=cac>0&&mcu>0?cac/mcu:null,anual=pAlvo*12*(1-N(lic.descAnual)/100),impl=priceFor(g*N(lic.horasSetup),L);
      o+=`<div class="card"><h3>Recorrência da licença</h3><div class="g2"><div>
        <p><b>Plano anual</b> (${pc(N(lic.descAnual),0)} de desconto): ${brl(anual)} por licença/ano, equivalente a ${brl(anual/12)} por mês.</p>
        <p style="margin-top:8px"><b>Taxa de implantação</b> sugerida: ${brl(impl)} (${num(N(lic.horasSetup),1)} h de trabalho).</p>
        <p style="margin-top:8px"><b>Contribuição mensal por licença:</b> ${brl(mcu)} (preço − impostos − custo variável − suporte).</p></div><div>
        <p><b>Vida média do cliente:</b> ${ch>0?num(1/ch,0)+' meses':'informe o churn para calcular'}</p>
        <p style="margin-top:8px"><b>LTV</b> (contribuição total ao longo da vida): ${ltv?brl(ltv):'—'}</p>
        <p style="margin-top:8px"><b>Retorno do CAC:</b> ${pay?num(pay,1)+' meses':'—'}${ltv&&cac>0?` · LTV/CAC ${num(ltv/cac,1)}×`:''}</p>
        ${ltv&&cac>0?`<p class="hint">${ltv/cac<3?'Referência de mercado: LTV/CAC abaixo de 3× indica aquisição cara ou preço baixo.':'Acima de 3× é considerado saudável (referência de mercado).'}</p>`:''}</div></div></div>`;
    }
    const rows=[50,65,80,95].map(oc=>{const hv=C.hv*oc/(N(S.cap.ocup)||1),gg=hv>0?C.fixo/hv:0,cc=calc(it,gg),pp=priceFor(cc.custo,L);return `<tr><td>${oc}%</td><td class="n">${brl(gg)}</td><td class="n">${brl(cc.custo)}</td><td class="n">${brl(pp)}</td><td class="n">${pp&&pAlvo?(pp/pAlvo-1>=0?'+':'')+pc((pp/pAlvo-1)*100,0):'—'}</td></tr>`}).join('');
    o+=`<div class="card"><h3>E se a agenda não encher?</h3><table><tr><th>Ocupação</th><th class="n">Custo da sua hora</th><th class="n">Custo do item</th><th class="n">Preço-alvo</th><th class="n">vs. hoje</th></tr>${rows}</table><p class="hint">Sua ocupação atual é ${pc(N(S.cap.ocup),0)}. ${c.rateio?'Este item usa rateio por volume, então a ocupação não altera o cálculo.':'Quanto menos horas você vende, mais cada hora precisa custar.'}</p></div>`;
  }
  $('#resdet').innerHTML=o;
  const pr=$('#premissas');
  if(pr)pr.innerHTML=`<p><b>${esc(S.neg.nome||'Negócio sem nome')}</b> · ${SEG[S.neg.seg].n} · ${REG[S.neg.regime].n} · ${new Date().toLocaleDateString('pt-BR')}</p>
   <p>Custo fixo mensal: ${brl(C.fixo)} · Horas vendáveis/mês: ${num(C.hv,0)} · Custo da hora: ${brl(C.gfun)}</p>
   <p>Impostos ${pc(N(S.taxas.imp))} · Comissão ${pc(N(S.taxas.com))} · Cartão/canal ${pc(N(S.taxas.canal))} · Outros ${pc(N(S.taxas.outros))} · Lucro alvo ${pc(N(S.taxas.lucro))} · Premium ${pc(N(S.taxas.prem))}</p>
   <p style="font-size:11px;color:#6F667E">Cálculo: preço = custo (variável + fixo rateado) ÷ (1 − impostos − taxas − lucro). Percentuais de imposto são referências: confirme com seu contador. Documento de apoio à decisão, não parecer contábil.</p>`;
}

/* ============ atualização ao vivo ============ */
function refresh(){
  const C=ctx(),set=(id,t)=>{const e=document.getElementById(id);if(e)e.innerHTML=t};
  $('#strip').innerHTML=`<div class="kpi"><span>Custo fixo / mês</span><b>${brl(C.fixo)}</b></div><div class="kpi"><span>Horas vendáveis / mês</span><b>${num(C.hv,0)} h</b></div><div class="kpi hl"><span>Custo da sua hora</span><b>${brl(C.gfun)}</b></div>`;
  set('lv-prov',`Provisão mensal calculada: <b>${brl(C.f.prov)}</b> sobre ${brl(S.fixos.filter(f=>f.enc&&f.k==='m').reduce((s,f)=>s+N(f.v),0))} de salários CLT.`);
  set('capconta',`<p>${num(S.cap.pessoas,1)} pessoa(s) × ${num(S.cap.horasDia,1)} h × ${num(S.cap.dias,1)} dias = <b>${num(C.bruto,0)} h</b> por mês no calendário.</p><p>− ${pc(S.cap.naoFat,0)} não faturável × ${pc(S.cap.ocup,0)} de ocupação = <b>${num(C.hv,0)} h vendáveis</b> (${C.bruto>0?pc(C.hv/C.bruto*100,0):'0%'} do tempo total).</p><p style="margin-top:8px">${S.cap.ocup>=90||S.cap.naoFat<10?'<span style="color:var(--warn)">Atenção: números muito otimistas. Poucos negócios vendem mais de 60–70% do tempo total.</span>':'Custo fixo ÷ horas vendáveis = <b>'+brl(C.gfun)+' por hora</b>.'}</p>`);
  const pv=pctVar(),L=N(S.taxas.lucro)/100,Lp=N(S.taxas.prem)/100;
  set('taxconta',`<p>Impostos + comissão + canal + outros = <b>${pc(pv*100,2)}</b> de cada venda.</p><div class="tiers"><div class="tier"><span>Mínimo</span><b>${markup(0)?num(markup(0),2)+'×':'—'}</b><small>Markup com lucro 0</small></div><div class="tier alvo"><span>Alvo</span><b>${markup(L)?num(markup(L),2)+'×':'—'}</b><small>Markup com ${pc(L*100)} de lucro</small></div><div class="tier"><span>Premium</span><b>${markup(Lp)?num(markup(Lp),2)+'×':'—'}</b><small>Markup com ${pc(Lp*100)} de lucro</small></div></div>${pv+L>=1?'<div class="alert e">A soma de percentuais chega a 100% ou mais: não existe preço possível. Reduza algum item.</div>':'<p class="hint">Markup = 1 ÷ (1 − percentuais). Ele multiplica o custo para chegar ao preço. O modelo original usava a mesma lógica, com faixas Silver/Gold/Diamond.</p>'}`);
  if(step===4&&S.itens[sel]){
    const it=S.itens[sel],c=calc(it),[a,b]=tiers(c);
    set('lv-item',`<table><tr><td>Custo variável</td><td class="n">${brl(c.cv)}</td></tr><tr><td>Custo fixo rateado (${num(c.hrs,2)} h × ${brl(C.gfun)}${c.rateio?' — por rateio':''})</td><td class="n">${brl(c.cf)}</td></tr>${c.risco>0?`<tr><td>Margem de risco</td><td class="n">${brl(c.risco)}</td></tr>`:''}<tr><td><b>Custo total por ${unitLabel(it)}</b></td><td class="n"><b>${brl(c.custo)}</b></td></tr><tr><td>Preço mínimo</td><td class="n">${brl(a)}</td></tr><tr><td><b>Preço-alvo</b></td><td class="n"><b>${brl(b)}</b></td></tr>${c.div>1&&b?`<tr><td>Preço-alvo por ${c.ul}</td><td class="n">${brl(b/c.div)}</td></tr>`:''}</table>`);
  }
  if(step===5)drawRes();
}

load();render();
</script>
